plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.nic.roam'
    compileSdk 36

    defaultConfig {
        applicationId "com.nic.roam"
        minSdk 26
        targetSdk 36
        versionCode 4
        versionName "1.0.3"
    }

    // AGP embeds a "dependency metadata" blob in the signing block by default. It is not
    // reproducible and F-Droid rejects it, so drop it (there are no dependencies anyway).
    dependenciesInfo {
        includeInApk false
        includeInBundle false
    }

    signingConfigs {
        release {
            // Only wire up signing when the keystore is actually present. On the GitHub
            // release runner KEYSTORE_PATH points at the decoded keystore; on F-Droid's
            // build server neither the env var nor the file exist, so the release build
            // is left unsigned for F-Droid to sign with its own key.
            def ksFile = file(System.getenv("KEYSTORE_PATH") ?: "roam.keystore")
            if (ksFile.exists()) {
                storeFile ksFile
                storePassword System.getenv("KEYSTORE_PASSWORD") ?: ""
                keyAlias System.getenv("KEY_ALIAS") ?: ""
                keyPassword System.getenv("KEY_PASSWORD") ?: ""
            }
        }
    }

    buildTypes {
        release {
            if (file(System.getenv("KEYSTORE_PATH") ?: "roam.keystore").exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
}

dependencies {
}
